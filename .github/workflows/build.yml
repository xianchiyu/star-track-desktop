name: 编译发布

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          check-latest: true

      - name: 下载依赖
        run: go mod tidy

      - name: 生成图标和资源文件
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          
          # 创建 256x256 图标
          $bmp = New-Object System.Drawing.Bitmap(256, 256)
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::AntiAlias
          $g.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
          
          # 深蓝背景
          $bgBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(6, 10, 20))
          $g.FillRectangle($bgBrush, 0, 0, 256, 256)
          
          # 星尘点缀
          $starBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(180, 255, 255, 255))
          $rand = New-Object System.Random(42)
          for ($i = 0; $i -lt 40; $i++) {
            $sx = $rand.Next(10, 246)
            $sy = $rand.Next(10, 246)
            $sr = $rand.Next(1, 3)
            $g.FillEllipse($starBrush, $sx, $sy, $sr, $sr)
          }
          
          # 新月（用两个圆裁切）
          $moonColor = [System.Drawing.Color]::FromArgb(255, 230, 200)
          $moonBrush = New-Object System.Drawing.SolidBrush($moonColor)
          $g.FillEllipse($moonBrush, 70, 50, 110, 110)
          $bgBrush2 = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(6, 10, 20))
          $g.FillEllipse($bgBrush2, 100, 40, 110, 110)
          
          # 轨道环
          $orbitPen = New-Object System.Drawing.Pen([System.Drawing.Color]::FromArgb(100, 147, 112, 219), 2)
          $orbitPen.DashStyle = [System.Drawing.Drawing2D.DashStyle]::Dash
          $g.DrawEllipse($orbitPen, 40, 20, 176, 176)
          
          # 轨道上的星星
          $accentBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 215, 0))
          $g.FillEllipse($accentBrush, 200, 90, 12, 12)
          $purpleBrush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(147, 112, 219))
          $g.FillEllipse($purpleBrush, 50, 160, 8, 8)
          
          $g.Dispose()
          
          # 保存为多尺寸 ICO
          $iconPath = "icon.ico"
          $ms = New-Object System.IO.MemoryStream
          $bmp.Save($ms, [System.Drawing.Imaging.ImageFormat]::Png)
          $pngBytes = $ms.ToArray()
          $ms.Dispose()
          
          # 写 ICO 文件头 + 单张 256x256 PNG
          $fs = [System.IO.File]::Create($iconPath)
          $bw = New-Object System.IO.BinaryWriter($fs)
          # ICONDIR
          $bw.Write([UInt16]0)      # reserved
          $bw.Write([UInt16]1)      # type: icon
          $bw.Write([UInt16]1)      # count: 1 image
          # ICONDIRENTRY
          $bw.Write([Byte]0)        # width 0 = 256
          $bw.Write([Byte]0)        # height 0 = 256
          $bw.Write([Byte]0)        # color count
          $bw.Write([Byte]0)        # reserved
          $bw.Write([UInt16]1)      # planes
          $bw.Write([UInt16]32)     # bit count
          $bw.Write([UInt32]$pngBytes.Length)  # bytes in res
          $bw.Write([UInt32]22)     # offset
          # image data
          $bw.Write($pngBytes)
          $bw.Dispose()
          $fs.Dispose()
          $bmp.Dispose()
          
          Write-Host "图标已生成: $iconPath"
          
          # 安装 rsrc 并生成 .syso
          go install github.com/akavel/rsrc@latest
          $rsrc = Join-Path (go env GOPATH) "bin" "rsrc.exe"
          & $rsrc -ico icon.ico -arch amd64 -o resource.syso
          
          Write-Host "资源文件已生成: resource.syso"

      - name: 编译
        run: go build -ldflags="-s -w -H windowsgui" -o star-track-desktop.exe

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          name: 星轨桌面版 ${{ github.ref_name }}
          body: |
            ## 星轨 · 心事星空 桌面版 ${{ github.ref_name }}

            下载 `star-track-desktop.exe`，双击运行即可安装使用。

            ### ⚠️ 关于 SmartScreen 提示
            首次运行时 Windows 可能弹出 SmartScreen 安全提示，这是因为本程序没有购买代码签名证书。
            点击「更多信息」→「仍要运行」即可。

            ### 更新说明
            - 详见仓库提交记录。
          files: star-track-desktop.exe