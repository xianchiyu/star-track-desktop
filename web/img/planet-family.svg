<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="body" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e8ff98"/>
      <stop offset="20%" stop-color="#c5f060"/>
      <stop offset="45%" stop-color="#9acd32"/>
      <stop offset="70%" stop-color="#6b8e23"/>
      <stop offset="90%" stop-color="#3a5010"/>
      <stop offset="100%" stop-color="#1a2808"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="95%" stop-color="rgba(154,205,50,0.12)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="58"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- 大气光晕 -->
  <circle cx="100" cy="100" r="66" fill="rgba(154,205,50,0.06)" filter="url(#glow)"/>
  <!-- 环-后半 -->
  <ellipse cx="100" cy="100" rx="88" ry="14" fill="none" stroke="rgba(180,220,100,0.18)" stroke-width="8"
           transform="rotate(-12 100 100)"/>
  <!-- 星球本体 -->
  <circle cx="100" cy="100" r="58" fill="url(#body)"/>
  <!-- 大陆/陆地色块 -->
  <g clip-path="url(#c)" opacity="0.5">
    <ellipse cx="80" cy="82" rx="20" ry="16" fill="rgba(50,120,30,0.2)"/>
    <ellipse cx="118" cy="105" rx="15" ry="22" fill="rgba(40,100,20,0.15)"/>
    <ellipse cx="90" cy="125" rx="12" ry="8" fill="rgba(60,130,40,0.12)"/>
  </g>
  <!-- 云层 -->
  <g clip-path="url(#c)" opacity="0.3">
    <ellipse cx="70" cy="90" rx="28" ry="4" fill="rgba(255,255,255,0.2)"/>
    <ellipse cx="125" cy="115" rx="22" ry="3" fill="rgba(255,255,255,0.15)"/>
  </g>
  <!-- 高光 -->
  <ellipse cx="78" cy="72" rx="16" ry="12" fill="rgba(255,255,255,0.07)" clip-path="url(#c)"/>
  <!-- 环-前半 -->
  <ellipse cx="100" cy="100" rx="88" ry="14" fill="none" stroke="rgba(180,220,100,0.3)" stroke-width="8"
           stroke-dasharray="48 235" stroke-dashoffset="-122"
           transform="rotate(-12 100 100)"/>
  <!-- 大气层 -->
  <circle cx="100" cy="100" r="59" fill="url(#atmo)"/>
</svg>
