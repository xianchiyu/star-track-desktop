<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="body" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#b0d8ff"/>
      <stop offset="18%" stop-color="#7aacf0"/>
      <stop offset="40%" stop-color="#4169e1"/>
      <stop offset="65%" stop-color="#2f4fb3"/>
      <stop offset="85%" stop-color="#1a2e6b"/>
      <stop offset="100%" stop-color="#080e28"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="95%" stop-color="rgba(65,105,225,0.1)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="58"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <circle cx="100" cy="100" r="66" fill="rgba(65,105,225,0.06)" filter="url(#glow)"/>
  <circle cx="100" cy="100" r="58" fill="url(#body)"/>
  <!-- 大气条纹 -->
  <g clip-path="url(#c)" opacity="0.5">
    <rect x="42" y="70" width="116" height="4" rx="2" fill="rgba(255,255,255,0.06)"/>
    <rect x="42" y="84" width="116" height="3" rx="1.5" fill="rgba(200,220,255,0.05)"/>
    <rect x="42" y="100" width="116" height="5" rx="2.5" fill="rgba(0,0,50,0.06)"/>
    <rect x="42" y="115" width="116" height="3" rx="1.5" fill="rgba(255,255,255,0.04)"/>
    <rect x="42" y="128" width="116" height="4" rx="2" fill="rgba(0,0,30,0.05)"/>
  </g>
  <!-- 大暗斑 -->
  <ellipse cx="88" cy="96" rx="14" ry="8" fill="rgba(0,0,40,0.15)" clip-path="url(#c)"/>
  <!-- 高光 -->
  <ellipse cx="78" cy="72" rx="14" ry="10" fill="rgba(255,255,255,0.06)" clip-path="url(#c)"/>
  <circle cx="100" cy="100" r="59" fill="url(#atmo)"/>
</svg>
