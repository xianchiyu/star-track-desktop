<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="body" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#e0d0ff"/>
      <stop offset="20%" stop-color="#b89cef"/>
      <stop offset="45%" stop-color="#9370db"/>
      <stop offset="70%" stop-color="#5e3a9e"/>
      <stop offset="90%" stop-color="#2d1b4e"/>
      <stop offset="100%" stop-color="#0e0820"/>
    </radialGradient>
    <radialGradient id="atmo" cx="50%" cy="50%" r="50%">
      <stop offset="85%" stop-color="transparent"/>
      <stop offset="95%" stop-color="rgba(147,112,219,0.15)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="58"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <!-- 大气光晕 -->
  <circle cx="100" cy="100" r="66" fill="rgba(147,112,219,0.08)" filter="url(#glow)"/>
  <!-- 环-后半 (被星球遮挡的部分) -->
  <ellipse cx="100" cy="100" rx="90" ry="16" fill="none" stroke="rgba(180,160,230,0.2)" stroke-width="10"
           transform="rotate(-20 100 100)" clip-path="url(#topClip)"/>
  <!-- 星球本体 -->
  <circle cx="100" cy="100" r="58" fill="url(#body)"/>
  <!-- 表面横纹 -->
  <g clip-path="url(#c)" opacity="0.6">
    <rect x="42" y="72" width="116" height="3" rx="1.5" fill="rgba(255,255,255,0.05)"/>
    <rect x="42" y="88" width="116" height="4" rx="2" fill="rgba(255,255,255,0.04)"/>
    <rect x="42" y="105" width="116" height="3" rx="1.5" fill="rgba(0,0,0,0.06)"/>
    <rect x="42" y="118" width="116" height="5" rx="2.5" fill="rgba(0,0,0,0.04)"/>
  </g>
  <!-- 高光 -->
  <ellipse cx="78" cy="72" rx="18" ry="14" fill="rgba(255,255,255,0.08)" clip-path="url(#c)"/>
  <!-- 环-前半 (在星球前面的部分) -->
  <ellipse cx="100" cy="100" rx="90" ry="16" fill="none" stroke="rgba(200,185,255,0.35)" stroke-width="10"
           stroke-dasharray="50 230" stroke-dashoffset="-120"
           transform="rotate(-20 100 100)"/>
  <ellipse cx="100" cy="100" rx="90" ry="16" fill="none" stroke="rgba(160,140,220,0.15)" stroke-width="18"
           stroke-dasharray="55 225" stroke-dashoffset="-118"
           transform="rotate(-20 100 100)"/>
  <!-- 大气层 -->
  <circle cx="100" cy="100" r="59" fill="url(#atmo)"/>
</svg>
