<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="body" cx="38%" cy="35%" r="55%">
      <stop offset="0%" stop-color="#fffbe0"/>
      <stop offset="15%" stop-color="#fff0a0"/>
      <stop offset="35%" stop-color="#ffd700"/>
      <stop offset="60%" stop-color="#daa520"/>
      <stop offset="82%" stop-color="#8b6914"/>
      <stop offset="100%" stop-color="#4a3508"/>
    </radialGradient>
    <radialGradient id="corona" cx="50%" cy="50%" r="50%">
      <stop offset="40%" stop-color="transparent"/>
      <stop offset="70%" stop-color="rgba(255,215,0,0.06)"/>
      <stop offset="90%" stop-color="rgba(255,215,0,0.03)"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
    <clipPath id="c"><circle cx="100" cy="100" r="56"/></clipPath>
    <filter id="glow"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="bigGlow"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <!-- 外层日冕 -->
  <circle cx="100" cy="100" r="90" fill="rgba(255,215,0,0.04)" filter="url(#bigGlow)"/>
  <!-- 内层光芒 -->
  <circle cx="100" cy="100" r="70" fill="rgba(255,220,80,0.08)" filter="url(#glow)"/>
  <!-- 星球本体 -->
  <circle cx="100" cy="100" r="56" fill="url(#body)"/>
  <!-- 太阳黑子 -->
  <g clip-path="url(#c)" opacity="0.4">
    <circle cx="90" cy="95" r="6" fill="rgba(100,60,0,0.3)"/>
    <circle cx="115" cy="82" r="4" fill="rgba(100,60,0,0.2)"/>
    <circle cx="105" cy="110" r="3" fill="rgba(100,60,0,0.2)"/>
  </g>
  <!-- 表面翻涌纹理 -->
  <g clip-path="url(#c)" opacity="0.25">
    <ellipse cx="80" cy="88" rx="20" ry="6" fill="rgba(255,255,200,0.3)"/>
    <ellipse cx="120" cy="108" rx="16" ry="5" fill="rgba(255,200,100,0.2)"/>
  </g>
  <!-- 高光 -->
  <ellipse cx="82" cy="78" rx="14" ry="10" fill="rgba(255,255,255,0.12)" clip-path="url(#c)"/>
  <!-- 日冕环 -->
  <circle cx="100" cy="100" r="62" fill="url(#corona)"/>
</svg>
